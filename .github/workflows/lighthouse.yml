name: Lighthouse

# Audits the public production URL only.
# PR previews are skipped: Vercel Deployment Protection returns 401 to CI
# without a Protection Bypass secret, and this job is not a merge blocker.
on:
  push:
    branches: [main]
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PRODUCTION_URL: https://fish-fric-remastered-8ag2.vercel.app

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only public, unauthenticated routes: everything under /app requires a session.
      - name: Audit with Lighthouse
        id: lhci
        # treosh/lighthouse-ci-action@v12
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          urls: |
            ${{ env.PRODUCTION_URL }}/
            ${{ env.PRODUCTION_URL }}/login
            ${{ env.PRODUCTION_URL }}/signup
            ${{ env.PRODUCTION_URL }}/docs
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Publish summary
        if: always()
        uses: actions/github-script@v7
        env:
          LHCI_MANIFEST: ${{ steps.lhci.outputs.manifest }}
        with:
          script: |
            const manifest = JSON.parse(process.env.LHCI_MANIFEST || "[]");
            const pct = (n) => (n == null ? "-" : Math.round(n * 100));
            const rows = manifest
              .filter((run) => run.isRepresentativeRun)
              .map((run) => {
                const s = run.summary;
                return `| ${run.url} | ${pct(s.performance)} | ${pct(s.accessibility)} | ${pct(s["best-practices"])} | ${pct(s.seo)} |`;
              });
            await core.summary
              .addHeading("Lighthouse report")
              .addRaw(
                [
                  "| URL | Perf | A11y | Best practices | SEO |",
                  "|---|---|---|---|---|",
                  ...rows,
                ].join("\n"),
              )
              .write();
