name: Migrate production

# Applies Prisma migrations to the production database.
# Does not run on pull requests (previews must not mutate prod schema).
#
# Required repository secrets:
#   DATABASE_URL  — Neon pooled or direct URL
#   DIRECT_URL    — Neon direct URL (no `-pooler`) preferred for migrate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "scripts/migrate-deploy.mjs"
      - "prisma.config.ts"

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
