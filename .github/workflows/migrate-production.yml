name: Migrate production

# Applies Prisma migrations to the production database.
# Never runs on pull_request (previews must not mutate prod schema).
#
# Prefer GitHub Environment secrets (production):
#   DATABASE_URL  — Neon pooled or direct URL
#   DIRECT_URL    — Neon direct URL (no `-pooler`) preferred for migrate
# Fallback: repository secrets with the same names.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prisma/migrations/**"
      - "prisma/schema.prisma"
      - "scripts/migrate-deploy.mjs"
      - "prisma.config.ts"

concurrency:
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: prisma migrate deploy
    # Block dispatch from non-main refs; push trigger is already main-only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy migrations
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
