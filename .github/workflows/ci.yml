name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall runs `prisma generate` (no database required)
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          # Domain cheque HMAC helpers read AUTH_SECRET in a few tests
          AUTH_SECRET: ci-test-secret

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fishfric
          POSTGRES_PASSWORD: fishfric
          POSTGRES_DB: fishfric_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishfric -d fishfric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric_test
      DIRECT_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric_test
      TEST_DATABASE_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric_test
      AUTH_SECRET: ci-test-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: Playwright (recruiter journey)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fishfric
          POSTGRES_PASSWORD: fishfric
          POSTGRES_DB: fishfric_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fishfric -d fishfric_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric_e2e
      DIRECT_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric_e2e
      AUTH_SECRET: ci-test-secret
      AUTH_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-test-secret
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed demo reef
        run: npm run db:seed

      - name: Verify seeded ledger
        run: npm run db:verify-ledger

      - name: Build app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (smoke + signed cheque)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
