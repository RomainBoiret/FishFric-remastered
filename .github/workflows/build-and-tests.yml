name: Build and Tests

permissions:
  contents: read
  actions: read
  checks: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-and-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    # npm run build runs prisma migrate deploy first, so we need a real DB
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fishfric
          POSTGRES_PASSWORD: fishfric
          POSTGRES_DB: fishfric
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric
      DIRECT_URL: postgresql://fishfric:fishfric@localhost:5432/fishfric
      AUTH_SECRET: ci-test-secret-do-not-use-in-prod

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      # non-blocking, the only high finding is a transitive next dep with no fix
      - name: Audit prod deps
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=./reports/junit.xml --coverage

      - name: Test report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: Vitest Tests
          path: reports/junit.xml
          reporter: java-junit

      - name: Coverage summary
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const path = "coverage/coverage-summary.json";
            if (!fs.existsSync(path)) return;
            const { total } = JSON.parse(fs.readFileSync(path, "utf8"));
            const row = (label, m) =>
              `| ${label} | ${m.pct}% | ${m.covered}/${m.total} |`;
            await core.summary
              .addHeading("Coverage (src/domain)")
              .addRaw(
                [
                  "| Metric | % | Covered |",
                  "|---|---|---|",
                  row("Lines", total.lines),
                  row("Statements", total.statements),
                  row("Functions", total.functions),
                  row("Branches", total.branches),
                ].join("\n"),
              )
              .write();
