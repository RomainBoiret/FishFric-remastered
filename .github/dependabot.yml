# Dependabot — weekly grouped updates (low noise for a solo portfolio repo).
# Docs: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montreal
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Montreal
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"
