version: 2
updates:
  # Node.js dependencies (package.json / package-lock.json at repo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      # prisma and @prisma/client must stay on the same version.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "prisma"
          - "@prisma/*"

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
